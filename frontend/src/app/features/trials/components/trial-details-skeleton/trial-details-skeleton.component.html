<section class="details" aria-busy="true" aria-live="polite" aria-label="Loading trial details" i18n-aria-label="@@trialDetails.loadingAriaLabel">
  <article class="panel details-section skeleton-card">
    <div class="skeleton-line skeleton-line--heading"></div>
    <div class="skeleton-line skeleton-line--wide"></div>
    <div class="skeleton-line"></div>
    <div class="chips">
      <span class="skeleton-chip"></span>
      <span class="skeleton-chip"></span>
      <span class="skeleton-chip"></span>
    </div>
  </article>

  @for (section of sections; track section) {
    <article class="panel details-section skeleton-card">
      <div class="skeleton-line skeleton-line--heading"></div>
      <div class="skeleton-line skeleton-line--wide"></div>
      <div class="skeleton-line"></div>
    </article>
  }
</section>
